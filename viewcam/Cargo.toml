[package]
name = "viewcam"
version = "0.1.0"
edition = "2021"
authors = ["Joseph D. Long <me@joseph-long.com>"]
license = "MIT"
description = "A camera-frame viewer wrapping viewarr: dark subtraction and saturation overlay"
repository = "https://github.com/joseph-long/viewarr"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The one real copy of the viewer lives at ../viewarr; viewcam embeds its
# ArrayViewerWidget and does the camera arithmetic in front of it.
viewarr = { path = "../viewarr" }

# Keep these pinned to the same versions viewarr uses, so there is exactly one
# egui (and one wasm-bindgen) in the dependency graph.
egui = "0.33.3"
eframe = "0.33.3"
egui-phosphor = "0.11"
log = "0.4"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"

[dependencies.web-sys]
version = "=0.3.85"
features = ["HtmlCanvasElement"]

[profile.release]
opt-level = 2
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O2"]
