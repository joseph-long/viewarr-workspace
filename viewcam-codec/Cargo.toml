[package]
name = "viewcam-codec"
version = "0.1.0"
edition = "2021"
authors = ["Joseph D. Long <me@joseph-long.com>"]
license = "MIT"
description = "Byte-shuffle + zstd frame codec and noise-matched quantization for viewcam, small enough to load in a web worker"
repository = "https://github.com/joseph-long/viewarr"

[lib]
crate-type = ["cdylib", "rlib"]

# Deliberately nothing from viewarr/egui: the WASM build is meant to be loaded
# on its own in a worker, so it should cost the page only the codec.
[dependencies]
# zstd decoding in pure Rust, so it builds for wasm32 with no C toolchain;
# no content checksums, which the transport already guards. Encoding uses
# the C library (the `encode-zstd` feature), which only the Python extension
# needs.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
zstd = { version = "0.14", optional = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.108"

[profile.release]
opt-level = 3
lto = true

[features]
encode-zstd = ["dep:zstd"]

[dev-dependencies]
zstd = { version = "0.14", default-features = false }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
