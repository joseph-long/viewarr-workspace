[package]
name = "viewarr-native"
version = "0.1.0"
edition = "2021"
authors = ["Joseph D. Long <me@joseph-long.com>"]
license = "MIT"
description = "Native desktop front-end for the viewarr array/image viewer"
repository = "https://github.com/joseph-long/viewarr"

[lib]
name = "viewarr_native"
path = "src/lib.rs"

[[bin]]
name = "viewarr"
path = "src/main.rs"

[dependencies]
# The one real copy of the viewer lives at ../viewarr; this crate is a native
# shell around the same ArrayViewerWidget the WASM build hands to JavaScript.
viewarr = { path = "../viewarr" }

# Keep these pinned to the same versions viewarr uses, so there is exactly one
# egui in the dependency graph (two copies would not share types).
egui = "0.33.3"
eframe = "0.33.3"
egui-phosphor = "0.11"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
# Native file-open dialog for the toolbar's Open buttons.
rfd = "0.15"

# Finder hands documents to an app as an "open documents" Apple Event rather
# than on argv, and winit does not answer it; src/macos.rs does. These are the
# same objc2 releases already in the graph through rfd and arboard.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-services",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSNotification",
    "NSString",
    "NSURL",
] }

[profile.release]
opt-level = 2
